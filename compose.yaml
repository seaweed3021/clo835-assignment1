# CLO835 - Assignment 1 - the whole stack in one command.
#   docker compose up -d      start everything
#   docker compose ps         see it running
#   docker compose down -v    stop it and delete the volume

services:
  mysql-db:
    build:
      context: .
      dockerfile: Dockerfile_mysql
    image: aneeta3021/mysql-db:v1
    environment:
      MYSQL_ROOT_PASSWORD: pw
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-ppw"]
      interval: 5s
      timeout: 5s
      retries: 20

  blue:
    build: .
    image: aneeta3021/webapp:v2
    ports: ["8081:8080"]
    environment: &app_env
      DBHOST: mysql-db
      DBPORT: "3306"
      DBUSER: root
      DBPWD: pw
      DATABASE: employees
      APP_COLOR: blue
    networks:
      - app-net
    depends_on:
      mysql-db:
        condition: service_healthy

  pink:
    image: aneeta3021/webapp:v2
    ports: ["8082:8080"]
    environment:
      <<: *app_env
      APP_COLOR: pink
    networks:
      - app-net
    depends_on:
      mysql-db:
        condition: service_healthy

  lime:
    image: aneeta3021/webapp:v2
    ports: ["8083:8080"]
    environment:
      <<: *app_env
      APP_COLOR: lime
    networks:
      - app-net
    depends_on:
      mysql-db:
        condition: service_healthy

networks:
  app-net:
    driver: bridge

volumes:
  mysql-data:
